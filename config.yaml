# WukongTTS 配置文件

# 模型配置
model:
  base_model_path: "qwen/Qwen2.5-7B-Instruct"  # 基础模型路径
  lora_path: "./dataset/output"                 # LoRA权重路径
  device: "auto"                                # 设备选择: auto, cuda, cpu

# 训练配置
training:
  output_dir: "./dataset/output"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 5e-5
  save_steps: 100
  logging_steps: 10
  warmup_ratio: 0.1
  max_length: 512

# LoRA配置
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules: 
    - "q_proj"
    - "k_proj" 
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# TTS配置
tts:
  model: "F5TTS_v1_Base"                        # F5-TTS模型版本
  ref_audio_path: "./audio/wukong_ref.wav"     # 参考音频路径
  ref_text: "俺老孙来也！妖怪哪里逃！"          # 参考文本
  output_dir: "./output"                        # 音频输出目录

# 生成配置
generation:
  max_length: 512
  temperature: 0.8
  top_p: 0.9
  do_sample: true

# 系统配置
system:
  log_level: "INFO"
  cache_dir: "./cache"
  
# Web界面配置
gradio:
  server_name: "0.0.0.0"
  server_port: 7860
  share: false
  inbrowser: true

# 数据配置
data:
  dataset_path: "./dataset/train/lora/西游记白话文.json"
  system_prompt: "你是大名鼎鼎的齐天大圣，花果山水帘洞美猴王孙悟空。说话要嚣张一点，自称俺老孙。"
